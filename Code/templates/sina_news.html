<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<!--
	1、在模板中输出变量的格式：{{变量名}}
	2、如果在pycharm中编辑HTML，一定要注意输入法。
		输入的｛｝如果不生效，则更新输入法
	-->
	<title>{{school_name}}</title>
	<link rel="icon" href="images/favicon.png">
	<style>
		/* All tag */
		* {
			font-size: 14px;
			margin: 0;
			padding: 0;
			border: none;
		}

		a {
			text-decoration: none;
		}

		ul {
			list-style: none;
		}

		/* header */
		header {
			position: relative;
			height: 80px;
			background: #4685c6;
		}

		header:after {
			position: absolute;
			bottom: 0;
			left: 0;
			width: 100%;
			height: 7px;
			content: '';
			background: #d6d6d6;
		}

		header>.container {
			position: relative;
			z-index: 1;
			width: 1200px;
			margin: 0 auto;
		}

		header>.container>a {
			display: block;
			float: left;
			margin: 15px 25px;
		}

		header>.container>nav {
			float: right;
		}

		/* nav */
		nav>a {
			font-size: 16px;
			font-family: 微软雅黑;
			line-height: 73px;
			display: block;
			float: left;
			width: 110px;
			height: 73px;
			text-align: center;
			color: #fff;
			position: relative;
		}

		nav>a:nth-child(1),nav>a:nth-child(1) li {
			background: #433b90;
		}

		nav>a:nth-child(2),nav>a:nth-child(2) li{
			background: #017fcb;
		}

		nav>a:nth-child(3),nav>a:nth-child(3) li {
			background: #78b917;
		}

		nav>a:nth-child(4),nav>a:nth-child(4) li {
			background: #feb800;
		}

		nav>a:nth-child(5),nav>a:nth-child(5) li {
			background: #f27c01;
		}

		nav>a:nth-child(6),nav>a:nth-child(6) li {
			background: #d40112;
		}

		nav>a:hover,
		nav>a.active {
			padding-bottom: 7px;
		}

		nav a ul {
			position: absolute;
			display: none;
			width: 100%;
		}

		nav a ul li {
			width: 100%;
			height: 40px;
			line-height: 40px;
		}

		nav a ul li:hover {
			width: 100%;
			height: 40px;
			background-color: #2596dc;
			line-height: 40px;
		}

		nav a:hover ul {
			display: block;
		}

		/* banner */
		.banner {
			position: relative;
			background: #eaeaea;
			height: 500px;
			background-image: url('./images/banner/banner1.jpg'), url('./images/banner/banner2.jpg'), url('./images/banner/banner3.jpg');
			background-repeat: no-repeat;
			background-size: 70% 80%, 70% 70%, 70% 70%;
			background-position: center, left center, right center;
			transition: all 2s;
			animation: my-banner 15s infinite;
		}

		@keyframes my-banner {
			0% {
				background-image: url('./images/banner/banner1.jpg'), url('./images/banner/banner2.jpg'), url('./images/banner/banner3.jpg');
			}

			30% {
				background-image: url('./images/banner/banner3.jpg'), url('./images/banner/banner2.jpg'), url('./images/banner/banner1.jpg');
			}

			60% {
				background-image: url('./images/banner/banner2.jpg'), url('./images/banner/banner3.jpg'), url('./images/banner/banner1.jpg');
			}

			100% {
				background-image: url('./images/banner/banner1.jpg'), url('./images/banner/banner2.jpg'), url('./images/banner/banner3.jpg');
			}
		}


		/* main */
		.main {
			position: relative;
			width: 1200px;
			height:573px;
			margin: 34px auto 0;
		}

		.main h1 {
			font-size: 30px;
			font-family: 微软雅黑;
			font-weight: lighter;
			margin-bottom: 23px;
		}

		.main h1>samp {
			font-size: 20px;
			font-family: 微软雅黑;
			color: #7c7c7c;
		}

		.main>aside {
			float: left;
			width: 450px;
		}

		.main>aside>dl {
			position: relative;
			display: block;
			height: 74px;
			margin-bottom: 17px;
		}

		.main>aside>dl>dt {
			position: absolute;
			top: -1px;
			left: 92px;
			font-size: 16px;
			font-weight: bold;
			line-height: 16px;
			text-decoration: underline;
		}

		.main>aside>dl>dd:first-of-type {
			position: absolute;
			left: 0;
		}

		.main>aside>dl>dd:last-of-type {
			position: absolute;
			top: 20px;
			left: 90px;
			line-height: 150%;
		}

		.main>article {
			float: right;
			width: 720px;
			overflow: hidden;
		}

		.main>article>p {
			margin-bottom: 15px;
			line-height: 150%;
			text-indent: 2em;
		}

		.main>article>img {
			margin-bottom: 15px;
			border: 1px solid #CCC;
		}

		/* footer */
		footer {
			position: relative;
			background: #4685c6;
		}

		footer:before {
			position: absolute;
			z-index: -1;
			top: -6px;
			left: 0;
			width: 100%;
			height: 6px;
			content: '';
			background: #d6d6d6;
		}

		footer>.container {
			width: 1200px;
			height: 64px;
			margin: 0 auto;
		}

		footer>.container>p {
			line-height: 64px;
			float: left;
			color: #fff;
		}

		footer>.container>span {
			float: right;
			margin: 14px 40px;
		}

		footer>.container>span>img {
			margin-left: 4px;
			opacity: .7;
		}

		footer>.container>span>img:hover {
			opacity: 1;
			cursor: pointer;
		}

		article a:link,article a:visited{
			color: black;
			font-size:16px;
		}

		article a:hover{
			color:red;
			font-size:18px;
		}
	</style>
</head>

<body>
   <!-- 此处为头部文件-->
   {% include 'header.html' %}
	<section class="main">
		<!--此处为左侧文件-->
		{% include 'left.html' %}
		<article>
			<h1>今日新浪新闻<samp>   {{school_name}}</samp></h1>
			{% for i in news_list %}
			<p><a href="{{i['href']}}" target="_blank">{{i['title']}}</a></p>
			{% endfor %}
			<!--FLASK模板中输出的变量默认不支持编译HTML代码，需要在变量后面加 | safe-->
			<p style="text-align:center; width:300px;"> {{pre_page | safe }} {{next_page | safe }}</p>
		</article>
	</section>
    <!--此处为底部文件-->
	{% include 'footer.html' %}
</body>

</html>
