# ============================================================
# nginx 反向代理 + 负载均衡（本机演示两个 waitress 实例也用这套）
# ============================================================
# 作用：把 80 端口收到的请求按轮询分发给后面的多个 Web 实例——
# 单个实例挂了 nginx 自动把流量切到另一个（配合摘除不健康节点），
# 这就是"多实例 + 无状态服务"能水平扩容的原因。
#
# 为什么 Web 实例必须无状态：session 已存 Redis（flask-session），
# 请求打到哪个实例都能读到登录态——这是加实例的前提。
# ============================================================

# upstream：定义后端实例池。weight 可调权重，本机演示各占一半
upstream web_pool {
    server 127.0.0.1:5000;   # web 实例 1（.env 里 WEB_PORT=5000）
    server 127.0.0.1:5001;   # web 实例 2（复制 .env 改 WEB_PORT=5001 再起一个）
}

server {
    listen 80;

    # 普通页面请求 → 负载均衡到 Web 实例池
    location / {
        proxy_pass http://web_pool;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;                    # 把真实客户端 IP 传给后端（日志用）
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # WebSocket 走长连接，必须把 HTTP/1.1 升级头传过去（否则握手失败）
    # 当前架构聊天服务单独在 8888 端口；若收进 nginx 统一入口就启用这段
    # location /ws {
    #     proxy_pass http://127.0.0.1:8888;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_read_timeout 3600s;
    # }
}
