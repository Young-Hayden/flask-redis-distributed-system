; 学生缓存定时刷新守护进程（每 60 秒把 MySQL 最新学生数据刷进 Redis）
[program:stu_refresh]
command=D:\PythonProject\R_project\.venv\Scripts\python.exe -u redis_listen.py
directory=D:\PythonProject\R_project\Code
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=D:\PythonProject\R_project\logs\stu_refresh.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
