; 主站 Web 服务（waitress 生产服务器，可复制本段改为 numprocs=2 起双实例）
[program:web]
command=D:\PythonProject\R_project\.venv\Scripts\python.exe -u start_server.py
directory=D:\PythonProject\R_project\Code
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=D:\PythonProject\R_project\logs\web.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
