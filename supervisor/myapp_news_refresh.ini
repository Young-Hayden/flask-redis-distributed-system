; 新浪/网易新闻缓存定时刷新守护进程（每 5 分钟，内部带 Redis 分布式锁）
; 分布式锁说明：redis_listen_wangyi_sina.py 每轮刷新前先抢 lock:refresh_* 锁，
; 因此本程序可以放心跑多个副本（比如 numprocs=2）做高可用，不会重复抓取/互相覆盖。
[program:news_refresh]
command=D:\PythonProject\R_project\.venv\Scripts\python.exe -u redis_listen_wangyi_sina.py
directory=D:\PythonProject\R_project\Code
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=D:\PythonProject\R_project\logs\news_refresh.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
